name: One-off remove legacy workbench UI

on:
  push:
    branches:
      - feature/ui-v1.6.1-dashboard
    paths:
      - .github/workflows/one-off-remove-legacy-ui.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: run one-off legacy UI cleanup' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/ui-v1.6.1-dashboard
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Remove legacy workbench shell source
        run: |
          python - <<'PY'
          from pathlib import Path

          workbench = Path("frontend/src/app/purchase/workbench/page.tsx")
          text = workbench.read_text()

          required = [
              "function WorkbenchSidebar(",
              "function SidebarLink(",
              '<WorkbenchSidebar user={user} view={view} onViewChange={changeView} />',
              "V1.0",
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit(f"legacy cleanup markers missing, refusing to rewrite: {missing}")

          for line in ["  fetchMe,\n", "  logout,\n", "  type AuthUser,\n"]:
              if line not in text:
                  raise SystemExit(f"expected import line missing: {line!r}")
              text = text.replace(line, "", 1)

          state_line = "  const [user, setUser] = useState<AuthUser | null>(null);\n"
          if state_line not in text:
              raise SystemExit("legacy user state marker missing")
          text = text.replace(state_line, "", 1)

          fetch_line = "    fetchMe().then(setUser).catch(() => setUser(null));\n"
          if fetch_line not in text:
              raise SystemExit("legacy fetchMe effect marker missing")
          text = text.replace(fetch_line, "", 1)

          old_open = '''  return (\n    <div className="min-h-screen bg-[#f7f8fc] text-[#26324b]">\n      <div className="flex min-h-screen">\n        <WorkbenchSidebar user={user} view={view} onViewChange={changeView} />\n        <main className="min-w-0 flex-1 px-5 pb-8 pt-5 sm:px-6 2xl:px-7">\n'''
          new_open = '''  return (\n    <div className="min-w-0 bg-[#f7f8fc] text-[#26324b]">\n      <main className="min-w-0 px-5 pb-8 pt-5 sm:px-6 2xl:px-7">\n'''
          if text.count(old_open) != 1:
              raise SystemExit(f"expected exactly one legacy workbench wrapper, found {text.count(old_open)}")
          text = text.replace(old_open, new_open, 1)

          old_close = '''        </main>\n      </div>\n      {newOrderOpen && <NewPurchaseModal'''
          new_close = '''      </main>\n      {newOrderOpen && <NewPurchaseModal'''
          if text.count(old_close) != 1:
              raise SystemExit(f"expected exactly one legacy workbench closing wrapper, found {text.count(old_close)}")
          text = text.replace(old_close, new_close, 1)

          start = text.index("\nfunction WorkbenchSidebar(")
          end = text.index("\nfunction WorkbenchHeader(", start)
          text = text[:start] + "\n" + text[end:]

          forbidden = [
              "function WorkbenchSidebar(",
              "function SidebarLink(",
              "<WorkbenchSidebar ",
              "V1.0",
              "fetchMe().then(setUser)",
          ]
          leftovers = [marker for marker in forbidden if marker in text]
          if leftovers:
              raise SystemExit(f"legacy UI leftovers after rewrite: {leftovers}")

          workbench.write_text(text)

          css_path = Path("frontend/src/app/globals.css")
          css = css_path.read_text()
          css_start_marker = "/*\n * 采购工作台历史上自带 WorkbenchSidebar。"
          if css_start_marker not in css:
              raise SystemExit("legacy workbench CSS marker missing")
          css_start = css.index(css_start_marker)
          css_end = css.index("::selection", css_start)
          css = css[:css_start].rstrip() + "\n\n" + css[css_end:]
          css_path.write_text(css)

          auth_path = Path("frontend/src/components/auth-shell.tsx")
          auth = auth_path.read_text()
          old_comment = ''' * V1.6.1 统一使用同一套全局侧栏 + 动态主内容区。\n * 采购工作台仍保留自己的业务视图组件，但旧 WorkbenchSidebar 由全局样式隐藏，\n * 避免出现“双侧栏 / 套工作台”的嵌套体验。'''
          new_comment = ''' * V1.6.1 统一使用同一套全局侧栏 + 动态主内容区。\n * 采购工作台只保留采购域业务视图；历史 WorkbenchSidebar 源码已删除，\n * 不再存在“双侧栏 / 套工作台”的第二套视觉外壳。'''
          if old_comment not in auth:
              raise SystemExit("AuthShell legacy UI comment marker missing")
          auth = auth.replace(old_comment, new_comment, 1)
          auth_path.write_text(auth)

          print("legacy workbench shell source removed successfully")
          PY

      - name: Validate rewritten frontend
        run: |
          cd frontend
          npm ci
          npm run check:routes
          npx tsc --noEmit
          npm run build
          test -f out/index.html

      - name: Commit cleanup to V1.6.1 branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app/purchase/workbench/page.tsx
          git add frontend/src/app/globals.css
          git add frontend/src/components/auth-shell.tsx
          git commit -m "移除采购工作台旧侧栏源码并统一新版UI"
          git push origin HEAD:feature/ui-v1.6.1-dashboard
