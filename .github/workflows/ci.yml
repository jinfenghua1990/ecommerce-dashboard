name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (migrate + lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@127.0.0.1:5432/ecommerce
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_SECRET_KEY: ci-only-test-secret-not-for-production-2026
      JACKYUN_SYNC_MODE: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt pyflakes
      - name: Migrate
        run: |
          cd backend && alembic upgrade head
      - name: Lint new core changes (blocking)
        run: |
          cd backend && python -m pyflakes \
            app/api/v1/supply_chain.py \
            app/api/v1/supply_chain_material_flow.py \
            app/services/production_service.py \
            app/services/production_material_flow_service.py \
            app/services/monthly_core.py \
            app/services/closing.py \
            app/models/production.py \
            app/tests/test_supply_chain_production.py \
            app/tests/test_supply_chain_material_flow.py \
            app/tests/test_monthly_core.py
      - name: Runtime undefined-name scan (blocking)
        run: |
          cd backend
          python -m pyflakes app 2>&1 | tee /tmp/pyflakes.txt || true
          if grep -E "undefined name|referenced before assignment" /tmp/pyflakes.txt; then
            echo "Runtime-level static error detected"
            exit 1
          fi
      - name: Test supply-chain and monthly core (blocking)
        run: |
          cd backend && python -m pytest \
            app/tests/test_supply_chain_production.py \
            app/tests/test_supply_chain_material_flow.py \
            app/tests/test_monthly_core.py \
            -q --tb=short
      - name: Full backend test suite (blocking)
        run: |
          cd backend && python -m pytest app/tests -q --tb=short
      - name: Code hygiene report
        continue-on-error: true
        run: |
          cd backend && python -m pyflakes app

  frontend:
    name: Frontend (typecheck + static build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          cd frontend && npm ci
      - name: Typecheck (tsc)
        run: |
          cd frontend && npx tsc --noEmit
      - name: Production static build
        run: |
          cd frontend && npm run build
          test -f out/index.html

  deployment:
    name: Deployment image (single-port 8000)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose topology
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Build unified production image
        run: |
          docker build -f Dockerfile -t ecommerce-dashboard:ci .
