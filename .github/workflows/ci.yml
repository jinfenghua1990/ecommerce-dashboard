name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (migrate + lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 当前 job 直接运行在 GitHub host runner，service container 通过映射端口访问。
      DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@127.0.0.1:5432/ecommerce
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt pyflakes
      - name: Migrate
        run: |
          cd backend && alembic upgrade head
      - name: Lint supply-chain changes (blocking)
        run: |
          cd backend && python -m pyflakes app/api/v1/supply_chain.py app/services/production_service.py app/models/production.py
      - name: Legacy lint report (non-blocking until existing debt is cleaned)
        continue-on-error: true
        run: |
          cd backend && python -m pyflakes app
      - name: Test (pytest)
        run: |
          cd backend && python -m pytest app/tests -q --tb=short

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: |
          cd frontend && npm ci
      - name: Typecheck (tsc)
        run: |
          cd frontend && npx tsc --noEmit
